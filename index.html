<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniPilot - Student Productivity Hub</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
</head>
<body>

  <!-- Sidebar Navigation -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <i class="fa-solid fa-graduation-cap brand-icon"></i>
      <h2>UniPilot</h2>
    </div>
    
    <nav class="nav-links">
      <button class="nav-item active" data-tab="dashboard">
        <i class="fa-solid fa-chart-pie"></i>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-tab="assignments">
        <i class="fa-solid fa-list-check"></i>
        <span>Assignments</span>
      </button>
      <button class="nav-item" data-tab="schedule">
        <i class="fa-solid fa-calendar-days"></i>
        <span>Schedule</span>
      </button>
      <button class="nav-item" data-tab="pomodoro">
        <i class="fa-solid fa-stopwatch"></i>
        <span>Pomodoro</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <button class="icon-btn" id="themeModalBtn" title="Theme Customizer">
        <i class="fa-solid fa-palette"></i>
      </button>
      <button class="icon-btn" id="darkModeToggle" title="Toggle Dark/Light Mode">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>
  </aside>

  <!-- Mobile Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main Application Body -->
  <main class="main-content">
    <header class="top-bar">
      <button class="menu-toggle" id="menuToggle">
        <i class="fa-solid fa-bars"></i>
      </button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="user-greeting">
        <span id="currentDate"></span>
      </div>
    </header>

    <!-- Tab 1: Dashboard -->
    <section class="tab-content active" id="dashboardTab">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon p-due"><i class="fa-solid fa-clock"></i></div>
          <div class="stat-info">
            <h3 id="statPending">0</h3>
            <p>Pending Tasks</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon p-done"><i class="fa-solid fa-circle-check"></i></div>
          <div class="stat-info">
            <h3 id="statCompleted">0</h3>
            <p>Completed Tasks</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon p-today"><i class="fa-solid fa-book-open"></i></div>
          <div class="stat-info">
            <h3 id="statTodayClasses">0</h3>
            <p>Classes Today</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon p-focus"><i class="fa-solid fa-fire"></i></div>
          <div class="stat-info">
            <h3 id="statFocusMinutes">0m</h3>
            <p>Focus Time</p>
          </div>
        </div>
      </div>

      <div class="dash-grid">
        <div class="dash-card">
          <h3><i class="fa-solid fa-triangle-exclamation"></i> Upcoming Deadlines</h3>
          <div id="urgentAssignmentsList" class="dash-list"></div>
        </div>
        <div class="dash-card">
          <h3><i class="fa-solid fa-calendar-day"></i> Today's Classes</h3>
          <div id="todayScheduleList" class="dash-list"></div>
        </div>
      </div>
    </section>

    <!-- Tab 2: Assignments -->
    <section class="tab-content" id="assignmentsTab">
      <div class="section-header">
        <h2>Assignment Tracker</h2>
        <button class="btn btn-primary" id="openAddAssignmentModal">
          <i class="fa-solid fa-plus"></i> Add Assignment
        </button>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <div id="assignmentsList" class="assignments-grid"></div>
    </section>

    <!-- Tab 3: Class Schedule -->
    <section class="tab-content" id="scheduleTab">
      <div class="section-header">
        <h2>Class Schedule</h2>
        <button class="btn btn-primary" id="openAddClassModal">
          <i class="fa-solid fa-plus"></i> Add Class
        </button>
      </div>

      <div class="day-selector" id="daySelector">
        <button class="day-btn active" data-day="Monday">Mon</button>
        <button class="day-btn" data-day="Tuesday">Tue</button>
        <button class="day-btn" data-day="Wednesday">Wed</button>
        <button class="day-btn" data-day="Thursday">Thu</button>
        <button class="day-btn" data-day="Friday">Fri</button>
        <button class="day-btn" data-day="Saturday">Sat</button>
        <button class="day-btn" data-day="Sunday">Sun</button>
      </div>

      <div id="scheduleList" class="schedule-grid"></div>
    </section>

    <!-- Tab 4: Pomodoro Timer -->
    <section class="tab-content" id="pomodoroTab">
      <div class="pomodoro-container">
        <div class="pomo-modes">
          <button class="pomo-mode-btn active" data-mode="work">Work (25m)</button>
          <button class="pomo-mode-btn" data-mode="short">Short Break (5m)</button>
          <button class="pomo-mode-btn" data-mode="long">Long Break (15m)</button>
        </div>

        <div class="timer-display">
          <h1 id="timerTime">25:00</h1>
          <p id="timerStatus">Stay Focused!</p>
        </div>

        <div class="timer-controls">
          <button class="btn btn-lg btn-primary" id="startTimerBtn">Start</button>
          <button class="btn btn-lg btn-secondary" id="pauseTimerBtn" disabled>Pause</button>
          <button class="btn btn-lg btn-outline" id="resetTimerBtn">Reset</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal: Add Assignment -->
  <div class="modal-backdrop" id="assignmentModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Add New Assignment</h3>
        <button class="close-modal">&times;</button>
      </div>
      <form id="assignmentForm">
        <div class="form-group">
          <label for="assignTitle">Title</label>
          <input type="text" id="assignTitle" required placeholder="e.g. CS101 Data Structures Lab">
        </div>
        <div class="form-group">
          <label for="assignSubject">Subject / Course</label>
          <input type="text" id="assignSubject" required placeholder="e.g. Computer Science">
        </div>
        <div class="form-group">
          <label for="assignDueDate">Due Date</label>
          <input type="date" id="assignDueDate" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Assignment</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Add Class -->
  <div class="modal-backdrop" id="classModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Add New Class</h3>
        <button class="close-modal">&times;</button>
      </div>
      <form id="classForm">
        <div class="form-group">
          <label for="className">Class Name</label>
          <input type="text" id="className" required placeholder="e.g. Algorithms & Complexity">
        </div>
        <div class="form-group">
          <label for="classRoom">Room / Building</label>
          <input type="text" id="classRoom" placeholder="e.g. Lab 304 or Zoom Link">
        </div>
        <div class="form-group">
          <label for="classDay">Day of Week</label>
          <select id="classDay" required>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="classStartTime">Start Time</label>
            <input type="time" id="classStartTime" required>
          </div>
          <div class="form-group">
            <label for="classEndTime">End Time</label>
            <input type="time" id="classEndTime" required>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Class</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Theme Customizer -->
  <div class="modal-backdrop" id="themeModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Theme Customizer</h3>
        <button class="close-modal">&times;</button>
      </div>
      <div class="theme-options">
        <label>Primary Accent Color</label>
        <div class="preset-colors">
          <button class="color-swatch" data-color="#6366f1" style="background:#6366f1;"></button>
          <button class="color-swatch" data-color="#3b82f6" style="background:#3b82f6;"></button>
          <button class="color-swatch" data-color="#10b981" style="background:#10b981;"></button>
          <button class="color-swatch" data-color="#ec4899" style="background:#ec4899;"></button>
          <button class="color-swatch" data-color="#8b5cf6" style="background:#8b5cf6;"></button>
          <button class="color-swatch" data-color="#f59e0b" style="background:#f59e0b;"></button>
        </div>
        <div class="form-group" style="margin-top: 15px;">
          <label for="customColorPicker">Custom Color</label>
          <input type="color" id="customColorPicker" value="#6366f1">
        </div>
        
        <hr style="margin: 20px 0; border: none; border-top: 1px solid var(--border-color);">
        
        <label>Backup & Data</label>
        <div class="data-actions">
          <button class="btn btn-secondary" id="exportDataBtn"><i class="fa-solid fa-download"></i> Export Data</button>
          <button class="btn btn-secondary" id="importDataBtn"><i class="fa-solid fa-upload"></i> Import Data</button>
          <input type="file" id="importFileInput" accept=".json" style="display:none;">
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
